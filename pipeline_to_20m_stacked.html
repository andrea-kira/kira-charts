<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kira Learning — Pipeline to $20M ARR</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 2rem; background: #fff; color: #1a1a1a; }
  .metrics { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
  .metric { background: #f5f4f0; border-radius: 8px; padding: 1rem; flex: 1; min-width: 120px; }
  .metric-label { font-size: 12px; color: #73726c; margin-bottom: 4px; }
  .metric-value { font-size: 20px; font-weight: 500; color: #1a1a1a; }
  .metric-sub { font-size: 11px; color: #a0a09a; margin-top: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 12px; color: #73726c; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .chart-wrap { position: relative; width: 100%; height: 300px; }
</style>
</head>
<body>

<div class="metrics">
  <div class="metric">
    <div class="metric-label">Current ARR</div>
    <div class="metric-value">$3.47M</div>
  </div>
  <div class="metric">
    <div class="metric-label">Pipeline TCV</div>
    <div class="metric-value">$22M+</div>
  </div>
  <div class="metric">
    <div class="metric-label">Year-end target</div>
    <div class="metric-value">$20M</div>
  </div>
  <div class="metric">
    <div class="metric-label">Pipeline coverage</div>
    <div class="metric-value">1.4x</div>
    <div class="metric-sub">vs. gap to target</div>
  </div>
</div>

<div class="legend">
  <span class="legend-item"><span class="legend-swatch" style="background:#1D9E75"></span>Current ARR ($3.47M)</span>
  <span class="legend-item"><span class="legend-swatch" style="background:#534AB7"></span>Advanced procurement ($7.7M)</span>
  <span class="legend-item"><span class="legend-swatch" style="background:#378ADD"></span>Active pilot ($3.3M)</span>
  <span class="legend-item"><span class="legend-swatch" style="background:#B5D4F4"></span>Early stage ($11M)</span>
</div>

<div class="chart-wrap">
  <canvas id="stackedChart"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const targetPlugin = {
  id: 'targetLine',
  afterDraw(chart) {
    const { ctx, scales: { y } } = chart;
    const yPos = y.getPixelForValue(20000000);
    const left = chart.chartArea.left;
    const right = chart.chartArea.right;
    ctx.save();
    ctx.beginPath();
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = '#E24B4A';
    ctx.lineWidth = 1.5;
    ctx.moveTo(left, yPos);
    ctx.lineTo(right, yPos);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#E24B4A';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('$20M target', right - 4, yPos - 6);
    ctx.restore();
  }
};

new Chart(document.getElementById('stackedChart'), {
  type: 'bar',
  plugins: [targetPlugin],
  data: {
    labels: ['Today', 'Pipeline'],
    datasets: [
      { label: 'Current ARR',          data: [3470000, 0],   backgroundColor: '#1D9E75', borderRadius: 3, stack: 's' },
      { label: 'Advanced procurement', data: [0, 7700000],   backgroundColor: '#534AB7', borderRadius: 3, stack: 's' },
      { label: 'Active pilot',         data: [0, 3300000],   backgroundColor: '#378ADD', borderRadius: 3, stack: 's' },
      { label: 'Early stage',          data: [0, 11000000],  backgroundColor: '#B5D4F4', borderRadius: 3, stack: 's' }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: ctx => {
            if (ctx.raw === 0) return null;
            return ctx.dataset.label + ': $' + (ctx.raw / 1000000).toFixed(1) + 'M';
          }
        }
      }
    },
    scales: {
      x: { stacked: true, grid: { display: false }, ticks: { color: '#888780', font: { size: 12 } } },
      y: {
        stacked: true,
        max: 26000000,
        grid: { color: 'rgba(136,135,128,0.12)' },
        ticks: { color: '#888780', callback: v => '$' + (v / 1000000).toFixed(0) + 'M' }
      }
    }
  }
});
</script>
</body>
</html>
